name: "CI: Lint, Typecheck, Build"

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Create env file (dummy values for build)
        run: |
          cat <<EOF > .env
          VITE_FIREBASE_API_KEY=dummy
          VITE_FIREBASE_AUTH_DOMAIN=dummy
          VITE_FIREBASE_PROJECT_ID=dummy
          VITE_FIREBASE_STORAGE_BUCKET=dummy
          VITE_FIREBASE_STORAGE_BUCKET_URL=https://dummy.example.com
          VITE_FIREBASE_MESSAGING_ID=dummy
          VITE_FIREBASE_APP_ID=dummy
          VITE_FIREBASE_MEASUREMENT_ID=dummy
          EOF
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
